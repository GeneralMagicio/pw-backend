services:
  pw-backend:
    build:
      context: .
    container_name: pw-backend
    restart: always
    ports:
      - 7070:7070
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7070']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s